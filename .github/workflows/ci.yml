name: CI

on:
  push:
    branches: [ main ]
    tags:
      - "*"
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**/*.md"

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: 'go.mod'
                  cache: true

            - name: Setup go-task
              uses: pnorton5432/setup-task@v1
              with:
                  task-version: 3.44.1

            - name: Run Tests
              run: task test

            - name: Upload coverage (artifact)
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: cover.out
